name: CI Check

on:
    pull_request:
    push:
        branches:
            - main

jobs:
    lint-and-format:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --legacy-peer-deps

            - name: Run formatter
              run: npm run format:check

            - name: Run linter
              run: npm run lint

    test:
        runs-on: ubuntu-latest
        container: mcr.microsoft.com/playwright:v1.56.1-jammy
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --legacy-peer-deps

            - name: Run tests
              run: npm run test:full

    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --legacy-peer-deps

            - name: Build project
              run: npm run build

            - name: Verify build output
              run: |
                  echo "Build completed successfully"
                  ls -la dist/
                  echo "Index.html content:"
                  cat dist/index.html
